<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Subscribe for exclusive content from TransmissionFunk.">
<title>TransmissionFunk</title>
<style>
:root { color-scheme: dark; --pink: #ff60d3; --ink: #fff6fb; }
* { box-sizing: border-box; }
body { margin: 0; background: #000000; color: var(--ink); font-family: "Courier New", Courier, monospace; }
main { min-height: 100svh; display: grid; justify-items: center; align-items: start; padding: 8px clamp(18px, 4vw, 56px) 40px; background: #000000; }
.hero { display: grid; place-items: center; width: min(100%, 1160px); padding: 0 20px 24px; text-align: center; }
.logo { display: block; width: min(100%, 525px); height: auto; mix-blend-mode: screen; margin: 0 auto; }
p { margin: 0; color: #d9cbd9; line-height: 1.55; }
button { font: inherit; cursor: pointer; }
.cta { display: inline-flex; justify-content: center; align-items: center; gap: 22px; padding: 14px 24px; min-height: 52px; border: 1px solid #5622f1; border-radius: 999px; background: #5622f1; color: #ffffff; font-weight: 800; box-shadow: 4px 4px 0 #30118a; }
.cta:hover { background: #6d40f5; }
.hero .cta { margin-top: 24px; }
:focus-visible { outline: 2px solid #65efff; outline-offset: 5px; }
dialog { width: min(440px, calc(100% - 36px)); padding: 34px 26px 28px; border: 1px solid var(--pink); background: #160d19; color: var(--ink); }
dialog::backdrop { background: #07030bdc; }
h2 { margin: 0 30px 8px 0; font-size: 1.55rem; }
.close { position: absolute; top: 8px; right: 8px; background: transparent; color: var(--ink); border: 0; width: 44px; height: 44px; font-size: 1.5rem; }
form { display: grid; gap: 12px; margin-top: 20px; }
input { width: 100%; padding: 12px; background: #09060d; color: var(--ink); border: 1px solid #886f88; font: inherit; }
.note { font-size: .9rem; }
@media (max-width: 480px) { .hero { padding-inline: 16px; } .logo { margin-top: 0; } }

.site-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px clamp(20px, 4vw, 56px); min-height: 104px; }
.brand { display: block; width: 170px; height: 68px; overflow: hidden; }
.brand img { display: block; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: screen; }
.nav-link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 23px; border: 1px solid #ff60d3; border-radius: 999px; color: #fff6fb; text-decoration: none; font-weight: 600; }
.nav-link:hover, .nav-link[aria-current] { background: #ff60d31a; }
main { min-height: calc(100svh - 104px); }
.contact-main { display: block; padding-top: 48px; }
.contact-content { max-width: 1000px; margin: 0 auto; }
.contact-content h1 { font-size: clamp(2.4rem, 7vw, 4rem); letter-spacing: -.045em; margin: 0 0 18px; }
.contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(32px, 6vw, 90px); margin-top: 36px; }
.contact-details { display: grid; align-content: start; gap: 24px; }
.contact-details a { color: #fff6fb; text-underline-offset: 5px; overflow-wrap: anywhere; }
.social-links { display: flex; gap: 24px; flex-wrap: wrap; }
.contact-form { margin: 0; gap: 10px; }
.contact-form input, .contact-form textarea { width: 100%; padding: 13px; border: 1px solid #886f88; border-radius: 8px; background: #09060d; color: #fff6fb; font: inherit; }
.contact-form textarea { resize: vertical; min-height: 150px; }
.contact-form label:not(:first-child) { margin-top: 8px; }
.contact-form .cta { margin-top: 8px; justify-self: start; }
@media (max-width: 640px) { .contact-grid { grid-template-columns: 1fr; } .brand { width: 140px; height: 60px; } }


:is(#open-signup, #signup .cta) {
  --button-gold: #F7E614;
  gap: 8px;
  font-size: 15px;
  padding: 0.7em 2.7em;
  letter-spacing: 0.06em;
  position: relative;
  font-family: inherit;
  font-weight: 500;
  border-radius: 0.6em;
  overflow: hidden;
  transition: color 0.3s, background 0.3s, box-shadow 0.3s;
  line-height: 1.4em;
  border: 2px solid var(--button-gold);
  background: #000000;
  color: var(--button-gold);
  box-shadow: 0 0 9px 3px rgba(247, 230, 20, 0.1);
}
:is(#open-signup, #signup .cta):hover {
  color: #FFF36B;
  background: #000000;
  box-shadow: 0 0 12px 3px rgba(247, 230, 20, 0.25);
}
@media (prefers-reduced-motion: reduce) {
  :is(#open-signup, #signup .cta) { transition: none; }
}

.nav-link {
  --button-gold: #F7E614;
  --button-gold: #F7E614;
  gap: 8px;
  font-size: 15px;
  padding: 0.7em 2.7em;
  letter-spacing: 0.06em;
  position: relative;
  font-family: inherit;
  font-weight: 500;
  border-radius: 0.6em;
  overflow: hidden;
  transition: color 0.3s, background 0.3s, box-shadow 0.3s;
  line-height: 1.4em;
  border: 2px solid var(--button-gold);
  background: #000000;
  color: var(--button-gold);
  box-shadow: 0 0 9px 3px rgba(247, 230, 20, 0.1);
}
.nav-link:hover {
  color: #FFF36B;
  background: #000000;
  box-shadow: 0 0 12px 3px rgba(247, 230, 20, 0.25);
}
@media (prefers-reduced-motion: reduce) {
  .nav-link { transition: none; }
}


input, textarea, select, button { font-family: inherit; }

/* White outlined buttons with moving arrows. */
.cta, :is(#open-signup, #signup .cta), .nav-link {
  color: #ffffff;
  border-color: #ffffff;
  background: #000000;
  gap: 8px;
  box-shadow: 0 0 9px 3px rgba(255, 255, 255, 0.1);
}
.cta:hover, .cta:focus-visible,
:is(#open-signup, #signup .cta):hover, :is(#open-signup, #signup .cta):focus-visible,
.nav-link:hover, .nav-link:focus-visible, .nav-link[aria-current] {
  color: #ffffff;
  background: #000000;
  box-shadow: 0 0 12px 3px rgba(255, 255, 255, 0.25);
}
.button-arrow {
  display: inline-block;
  transition: transform 180ms ease;
}
.cta:hover .button-arrow, .cta:focus-visible .button-arrow,
.nav-link:hover .button-arrow, .nav-link:focus-visible .button-arrow {
  transform: translate(3px, 0);
}
@media (prefers-reduced-motion: reduce) {
  .button-arrow { transition: none; }
  .cta:hover .button-arrow, .cta:focus-visible .button-arrow,
  .nav-link:hover .button-arrow, .nav-link:focus-visible .button-arrow {
    transform: none;
  }
}


body, main, .contact-main { background: #000; }
.home-main { min-height: calc(100svh - 104px); padding-top: 0; }
.home-main .hero { padding-top: 0; }
.home-main video.logo { width: auto; max-width: 100%; height: min(65svh,600px); object-fit: contain; }
.contact-main { padding-top: 16px; }
.contact-grid { align-items: center; margin-top: 0; }
.contact-animation video { display: block; width: 100%; height: auto; background: #000; }
@media(max-width:640px) {
  .home-main video.logo { height: min(58svh,600px); }
  .contact-animation { max-width: 380px; margin: auto; }
}
@media(prefers-reduced-motion:reduce) {

}


.cta:hover, .cta:focus-visible,
:is(#open-signup, #signup .cta):hover, :is(#open-signup, #signup .cta):focus-visible,
.nav-link:hover, .nav-link:focus-visible {
  color: #f0793a;
  border-color: #f0793a;
  background: #000000;
  box-shadow: 0 0 12px 3px rgba(240, 121, 58, 0.25);
}


/* Orange hover tint for the header logo. */
.brand {
  position: relative;
}
.brand::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #f0793a;
  mix-blend-mode: multiply;
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease;
}
.brand:hover::after,
.brand:focus-visible::after {
  opacity: 1;
}
@media (prefers-reduced-motion: reduce) {
  .brand::after { transition: none; }
}


:is(#open-signup, #signup .cta) {
  padding: 9px 22px;
  min-height: 40px;
  font-size: 13px;
  gap: 7px;
}

.mobile-menu { display: none; }
@media (max-width: 680px) {
  .desktop-navigation { display: none; }
  .site-header { position: relative; z-index: 10; }
  .mobile-menu { display: block; }
  .mobile-menu summary {
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 5px; width: 44px; height: 44px;
    border: 1px solid #fff; border-radius: 8px;
    color: #fff; background: #000; cursor: pointer; list-style: none;
  }
  .mobile-menu summary::-webkit-details-marker { display: none; }
  .menu-bar { width: 20px; height: 2px; background: currentColor; }
  .mobile-menu summary:hover, .mobile-menu summary:focus-visible {
    color: #f0793a; border-color: #f0793a;
  }
  .mobile-dropdown {
    position: absolute; top: calc(100% - 8px); right: clamp(20px,4vw,56px);
    min-width: 180px; padding: 8px; border: 1px solid #fff;
    border-radius: 8px; background: #000;
  }
  .mobile-dropdown a {
    display: block; padding: 12px 16px; color: #fff; text-decoration: none;
  }
  .mobile-dropdown a:hover, .mobile-dropdown a:focus-visible { color: #f0793a; }
}


body { min-height: 100svh; display: flex; flex-direction: column; }
.site-header { flex-shrink: 0; }
main.home-main, main.contact-main {
  flex: 1 0 auto;
  min-height: calc(100svh - 184px);
}
.site-footer {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 18px clamp(20px,4vw,56px); min-height: 80px;
  margin-top: auto; background: #000; color: #fff;
  font-family: inherit; font-size: 12px;
}
.site-footer p { margin: 0; }
.footer-socials { display: flex; align-items: center; gap: 12px; }
.footer-socials a {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 44px; min-height: 44px; color: #fff; border-radius: 6px;
}
.footer-socials a:hover, .footer-socials a:focus-visible { color: #f0793a; }
.footer-socials svg { display: block; width: 24px; height: 24px; }
@media(max-width:420px) {
  .site-footer { gap: 8px; font-size: 11px; padding-inline: 16px; }
  .footer-socials { gap: 2px; }
}


#signup {

#signup .cta {

#signup input {

}

<dialog id="signup" aria-label="Subscribe">
  <button class="close" type="button" aria-label="Close sign-up">×</button>
  <p class="note">Prototype only. Email addresses aren’t collected.</p>
  <form>
    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="you@example.com" required autofocus>
    <button type="submit" class="cta">Subscribe <span class="button-arrow" aria-hidden="true">→</span></button>
    <p class="note" role="status"></p>
  </form>
</dialog>
<script>
const animation = document.querySelector('video');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

function updateAnimation() {
  if (reducedMotion.matches) {
    animation.pause();
  } else {
    animation.play().then(() => { animation.controls = false; }).catch(() => { animation.controls = true; });
  }
}

reducedMotion.addEventListener('change', updateAnimation);
updateAnimation();

const dialog = document.querySelector('#signup');
const form = dialog.querySelector('form');
const status = dialog.querySelector('[role="status"]');

document.querySelector('#open-signup').addEventListener('click', () => dialog.showModal());
dialog.querySelector('.close').addEventListener('click', () => dialog.close());
dialog.addEventListener('close', () => {
  form.reset();
  status.textContent = '';
});
form.addEventListener('submit', event => {
  event.preventDefault();
  form.reset();
  status.textContent = 'Demo complete. No email address was saved.';
});
</script>

<script>
const mobileMenu = document.querySelector('.mobile-menu');
document.addEventListener('click', event => {
  if (!mobileMenu.contains(event.target)) mobileMenu.open = false;
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && mobileMenu.open) {
    mobileMenu.open = false;
    mobileMenu.querySelector('summary').focus();
  }
});
mobileMenu.querySelector('a').addEventListener('click', () => {
  mobileMenu.open = false;
});
window.matchMedia('(max-width: 680px)').addEventListener('change', () => {
  mobileMenu.open = false;
});
</script>
