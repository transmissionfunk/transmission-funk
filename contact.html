<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Contact Transmission Funk for enquiries.">
<title>Contact | Transmission Funk</title>
<style>
:root { color-scheme: dark; --pink: #ff60d3; --ink: #fff6fb; }
* { box-sizing: border-box; }
body { margin: 0; background: #09060d; color: var(--ink); font-family: "Courier New", Courier, monospace; }
main { min-height: 100svh; display: grid; place-items: center; padding: clamp(18px, 4vw, 56px); background: radial-gradient(ellipse at 50% 30%, #28122e, transparent 65%); }
.hero { display: grid; place-items: center; width: min(100%, 1160px); padding: clamp(30px, 5vw, 65px) 20px; text-align: center; }
.logo { display: block; width: min(100%, 525px); height: auto; mix-blend-mode: screen; margin: -16px auto 0; }
p { margin: 0; color: #d9cbd9; line-height: 1.55; }
button { font: inherit; cursor: pointer; }
.cta { display: inline-flex; justify-content: center; align-items: center; gap: 22px; padding: 14px 24px; min-height: 52px; border: 1px solid var(--pink); border-radius: 999px; background: var(--pink); color: #20091b; font-weight: 800; box-shadow: 4px 4px 0 #8b3a83; }
.cta:hover { background: #ff9ae5; }
.hero .cta { margin-top: 24px; }
:focus-visible { outline: 2px solid #65efff; outline-offset: 5px; }
dialog { width: min(440px, calc(100% - 36px)); padding: 34px 26px 28px; border: 1px solid var(--pink); background: #160d19; color: var(--ink); }
dialog::backdrop { background: #07030bdc; }
h2 { margin: 0 30px 8px 0; font-size: 1.55rem; }
.close { position: absolute; top: 8px; right: 8px; background: transparent; color: var(--ink); border: 0; width: 44px; height: 44px; font-size: 1.5rem; }
form { display: grid; gap: 12px; margin-top: 20px; }
input { width: 100%; padding: 12px; background: #09060d; color: var(--ink); border: 1px solid #886f88; font: inherit; }
.note { font-size: .9rem; }
@media (max-width: 480px) { .hero { padding-inline: 16px; } .logo { margin-top: 0; } }

.site-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px clamp(20px, 4vw, 56px); min-height: 104px; }
.brand { display: block; width: 170px; height: 68px; overflow: hidden; }
.brand img { display: block; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: screen; }
.nav-link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 23px; border: 1px solid #ff60d3; border-radius: 999px; color: #fff6fb; text-decoration: none; font-weight: 600; }
.nav-link:hover, .nav-link[aria-current] { background: #ff60d31a; }
main { min-height: calc(100svh - 104px); }
.contact-main { display: block; padding-top: 48px; }
.contact-content { max-width: 1000px; margin: 0 auto; }
.contact-content h1 { font-size: clamp(2.4rem, 7vw, 4rem); letter-spacing: -.045em; margin: 0 0 18px; }
.contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(32px, 6vw, 90px); margin-top: 36px; }
.contact-details { display: grid; align-content: start; gap: 24px; }
.contact-details a { color: #fff6fb; text-underline-offset: 5px; overflow-wrap: anywhere; }
.social-links { display: flex; gap: 24px; flex-wrap: wrap; }
.contact-form { margin: 0; gap: 10px; }
.contact-form input, .contact-form textarea { width: 100%; padding: 13px; border: 1px solid #886f88; border-radius: 8px; background: #09060d; color: #fff6fb; font: inherit; }
.contact-form textarea { resize: vertical; min-height: 150px; }
.contact-form label:not(:first-child) { margin-top: 8px; }
.contact-form .cta { margin-top: 8px; justify-self: start; }
@media (max-width: 640px) { .contact-grid { grid-template-columns: 1fr; } .brand { width: 140px; height: 60px; } }

.nav-link {
  --button-purple: #a386ff;
  --button-purple: #a386ff;
  gap: 8px;
  font-size: 15px;
  padding: 0.7em 2.7em;
  letter-spacing: 0.06em;
  position: relative;
  font-family: inherit;
  font-weight: 500;
  border-radius: 0.6em;
  overflow: hidden;
  transition: color 0.3s, background 0.3s, box-shadow 0.3s;
  line-height: 1.4em;
  border: 2px solid var(--button-purple);
  background: #000000;
  color: var(--button-purple);
  box-shadow: 0 0 9px 3px rgba(86, 34, 241, 0.1);
}
.nav-link:hover {
  color: #c7b5ff;
  background: #000000;
  box-shadow: 0 0 12px 3px rgba(86, 34, 241, 0.25);
}
@media (prefers-reduced-motion: reduce) {
  .nav-link { transition: none; }
}


input, textarea, select, button { font-family: inherit; }

/* White outlined buttons with moving arrows. */
.cta, #open-signup, .nav-link {
  color: #ffffff;
  border-color: #ffffff;
  background: #000000;
  gap: 8px;
  box-shadow: 0 0 9px 3px rgba(255, 255, 255, 0.1);
}
.cta:hover, .cta:focus-visible,
#open-signup:hover, #open-signup:focus-visible,
.nav-link:hover, .nav-link:focus-visible, .nav-link[aria-current] {
  color: #ffffff;
  background: #000000;
  box-shadow: 0 0 12px 3px rgba(255, 255, 255, 0.25);
}
.button-arrow {
  display: inline-block;
  transition: transform 180ms ease;
}
.cta:hover .button-arrow, .cta:focus-visible .button-arrow,
.nav-link:hover .button-arrow, .nav-link:focus-visible .button-arrow {
  transform: translate(3px, 0);
}
@media (prefers-reduced-motion: reduce) {
  .button-arrow { transition: none; }
  .cta:hover .button-arrow, .cta:focus-visible .button-arrow,
  .nav-link:hover .button-arrow, .nav-link:focus-visible .button-arrow {
    transform: none;
  }
}


body, main, .contact-main { background: #000; }
.home-main { min-height: calc(100svh - 104px); padding-top: 0; }
.home-main .hero { padding-top: 0; }
.home-main video.logo { width: auto; max-width: 100%; height: min(65svh,600px); object-fit: contain; }
.contact-main { padding-top: 16px; }
.contact-grid { align-items: center; margin-top: 0; }
.contact-animation video { display: block; width: 100%; height: auto; background: #000; }
@media(max-width:640px) {
  .home-main video.logo { height: min(58svh,600px); }
  .contact-animation { max-width: 380px; margin: auto; }
}
@media(prefers-reduced-motion:reduce) {

}


.cta:hover, .cta:focus-visible,
#open-signup:hover, #open-signup:focus-visible,
.nav-link:hover, .nav-link:focus-visible {
  color: #f0793a;
  border-color: #f0793a;
  background: #000000;
  box-shadow: 0 0 12px 3px rgba(240, 121, 58, 0.25);
}


.contact-main {
  display: grid;
  align-items: center;
  min-height: calc(100svh - 104px);
  padding-top: 32px;
  padding-bottom: 32px;
}
.contact-content { width: 100%; }
.contact-form input, .contact-form textarea {
  border: 1px solid #ffffff;
  background: #000000;
}

.contact-form input:focus,
.contact-form textarea:focus {
  outline: 1px solid #ffffff;
  outline-offset: 2px;
  border-color: #ffffff;
  box-shadow: none;
}


/* Orange hover tint for the header logo. */
.brand {
  position: relative;
}
.brand::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #f0793a;
  mix-blend-mode: multiply;
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease;
}
.brand:hover::after,
.brand:focus-visible::after {
  opacity: 1;
}
@media (prefers-reduced-motion: reduce) {
  .brand::after { transition: none; }
}


.mobile-menu { display: none; }
@media (max-width: 680px) {
  .desktop-navigation { display: none; }
  .site-header { position: relative; z-index: 10; }
  .mobile-menu { display: block; }
  .mobile-menu summary {
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 5px; width: 44px; height: 44px;
    border: 1px solid #fff; border-radius: 8px;
    color: #fff; background: #000; cursor: pointer; list-style: none;
  }
  .mobile-menu summary::-webkit-details-marker { display: none; }
  .menu-bar { width: 20px; height: 2px; background: currentColor; }
  .mobile-menu summary:hover, .mobile-menu summary:focus-visible {
    color: #f0793a; border-color: #f0793a;
  }
  .mobile-dropdown {
    position: absolute; top: calc(100% - 8px); right: clamp(20px,4vw,56px);
    min-width: 180px; padding: 8px; border: 1px solid #fff;
    border-radius: 8px; background: #000;
  }
  .mobile-dropdown a {
    display: block; padding: 12px 16px; color: #fff; text-decoration: none;
  }
  .mobile-dropdown a:hover, .mobile-dropdown a:focus-visible { color: #f0793a; }
}


.contact-form .cta {
  border-radius: 8px;
}

body { min-height: 100svh; display: flex; flex-direction: column; }
.site-header { flex-shrink: 0; }
main.home-main, main.contact-main {
  flex: 1 0 auto;
  min-height: calc(100svh - 184px);
}
.site-footer {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 18px clamp(20px,4vw,56px); min-height: 80px;
  margin-top: auto; background: #000; color: #fff;
  font-family: inherit; font-size: 12px;
}
.site-footer p { margin: 0; }
.footer-socials { display: flex; align-items: center; gap: 12px; }
.footer-socials a {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 44px; min-height: 44px; color: #fff; border-radius: 6px;
}
.footer-socials a:hover, .footer-socials a:focus-visible { color: #f0793a; }
.footer-socials svg { display: block; width: 24px; height: 24px; }
@media(max-width:420px) {
  .site-footer { gap: 8px; font-size: 11px; padding-inline: 16px; }
  .footer-socials { gap: 2px; }
}

</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="Transmission Funk home"><img src="tf-logo-glitch.jpg" alt="Transmission Funk" width="720" height="720"></a>
  <nav class="desktop-navigation" aria-label="Main navigation"><a class="nav-link" href="contact.html" aria-current="page">Contact</a></nav>
<details class="mobile-menu">
    <summary aria-label="Navigation menu">
      <span class="menu-bar" aria-hidden="true"></span>
      <span class="menu-bar" aria-hidden="true"></span>
      <span class="menu-bar" aria-hidden="true"></span>
    </summary>
    <nav class="mobile-dropdown" aria-label="Mobile navigation">
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </details>
</header>
<main class="contact-main">
  <section class="contact-content" aria-label="Contact Transmission Funk">
    <div class="contact-grid">
      <div class="contact-animation">
        <video id="dancing-video" width="532" height="350" preload="auto" muted loop playsinline controls aria-label="Transmission Funk dancing animation">
          <source src="TF Dancing Animation.mp4" type="video/mp4">
        </video>
      </div>
      <form class="contact-form" id="enquiry-form" action="mailto:transmissionfunk@gmail.com" method="post" enctype="text/plain">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" maxlength="150" required>
        <label for="contact-email">Email address</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" maxlength="3000" required></textarea>
        <button class="cta" type="submit">Send <span class="button-arrow" aria-hidden="true">→</span></button>
        <p class="note" role="status" id="enquiry-status"></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>© 2026 | Transmission Funk</p>
  <nav class="footer-socials" aria-label="Social media">
    <a href="https://www.instagram.com/transmissionfunk/" aria-label="Transmission Funk on Instagram" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <a href="https://soundcloud.com/transmissionfunk" aria-label="Transmission Funk on SoundCloud" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 28 24" aria-hidden="true">
        <g stroke="currentColor" stroke-linecap="round" stroke-width="1.5">
          <path d="M2 13v4 M5 10v9 M8 8v11 M11 6v13"/>
        </g>
        <path fill="currentColor" d="M14 19h9a4 4 0 0 0 0-8 4 4 0 0 0-1.3.2A6.5 6.5 0 0 0 14 5.7Z"/>
      </svg>
    </a>
  </nav>
</footer>

<script>
document.querySelector('#enquiry-form').addEventListener('submit', function (event) {
  event.preventDefault();
  const details = new FormData(this);
  const subject = 'Transmission Funk enquiry from ' + details.get('name');
  const body = 'Name: ' + details.get('name') + '\nEmail: ' + details.get('email') + '\n\n' + details.get('message');
  window.location.href = 'mailto:transmissionfunk@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  document.querySelector('#enquiry-status').textContent = 'Send the enquiry from your email app. You can also email transmissionfunk@gmail.com directly.';
});
</script>
<script>
const glassMotion = window.matchMedia('(prefers-reduced-motion: reduce)');


const dance = document.querySelector('#dancing-video');
function playDance() {
  if (glassMotion.matches) { dance.pause(); dance.controls = true; return; }
  dance.play().then(() => { dance.controls = false; }).catch(() => { dance.controls = true; });
}
glassMotion.addEventListener('change', playDance);
playDance();
</script>
<script>
const mobileMenu = document.querySelector('.mobile-menu');
document.addEventListener('click', event => {
  if (!mobileMenu.contains(event.target)) mobileMenu.open = false;
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && mobileMenu.open) {
    mobileMenu.open = false;
    mobileMenu.querySelector('summary').focus();
  }
});
mobileMenu.querySelector('a').addEventListener('click', () => {
  mobileMenu.open = false;
});
window.matchMedia('(max-width: 680px)').addEventListener('change', () => {
  mobileMenu.open = false;
});
</script>
</body>
</html>
